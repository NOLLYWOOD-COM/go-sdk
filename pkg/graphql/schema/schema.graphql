"""Represents the type of trivia content."""
enum TriviaType {
  "Behind-the-scenes production notes"
  PRODUCTION
  "Mistakes and continuity errors"
  GOOFS
  "Memorable quotes from the work"
  QUOTES
  "Hidden references and Easter eggs"
  EASTER_EGGS
  "General trivia and interesting facts"
  GENERAL
}

