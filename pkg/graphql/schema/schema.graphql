"""Grouping dimension for event aggregates query"""
enum EventAggregatesGroupBy {
  "Group by date only"
  DATE
  "Group by date and event details"
  DATE_EVENT
  "Group by date, device type, and country"
  DATE_DEVICE_COUNTRY
  "Group by work"
  WORK
  "Group by person"
  PERSON
  "Group by creator"
  CREATOR
}

"""Input for querying event aggregates"""
input GetEventAggregatesInput {
  "Start date for the query period (YYYY-MM-DD)"
  startDate: String
  "End date for the query period (YYYY-MM-DD)"
  endDate: String
  "Grouping dimension for aggregation"
  groupBy: EventAggregatesGroupBy
  "Maximum number of results to return"
  limit: Int
  "Filter by single event name"
  eventName: String
  "Filter by single event category"
  eventCategory: String
  "Filter by single device type"
  deviceType: String
  "Filter by single country"
  country: String
  "Filter by single work ID"
  workId: String
  "Filter by single person ID"
  personId: String
  "Filter by single creator ID"
  creatorId: String
  "List of event names to filter by"
  eventNames: [String!]
  "List of event categories to filter by"
  eventCategories: [String!]
  "List of device types to filter by"
  deviceTypes: [String!]
  "List of countries to filter by"
  countries: [String!]
  "List of work IDs to filter by"
  workIds: [String!]
  "List of person IDs to filter by"
  personIds: [String!]
  "List of creator IDs to filter by"
  creatorIds: [String!]
  "JSON object with property key-value pairs to match (AND logic)"
  propFilters: String
  "Property key for OR filter"
  propOrKey: String
  "Comma-separated property values for OR filter (matches any)"
  propOrValues: String
}

"""
Event aggregate result with all possible fields.
Fields are populated based on the groupBy parameter.
"""
type EventAggregateResult {
  "Date of the aggregate (present for date, date_event, date_device_country groupings)"
  date: String
  "Event name (present for date_event grouping)"
  eventName: String
  "Event category (present for date_event grouping)"
  eventCategory: String
  "Device type (present for date_device_country grouping)"
  deviceType: String
  "Country (present for date_device_country grouping)"
  country: String
  "Work ID (present for work grouping)"
  workId: String
  "Person ID (present for person grouping)"
  personId: String
  "Creator ID (present for creator grouping)"
  creatorId: String
  "Total event count"
  eventCount: Int!
  "Unique users count"
  uniqueUsers: Int!
  "Unique sessions count"
  uniqueSessions: Int!
}

