  NEUTRAL
  NEGATIVE
}

"""Represents the reason code for rejecting a review."""
enum ReviewRejectionReasonCode {
  "The review contains spammy content"
  SPAM
  "The review contains offensive language or content"
  OFFENSIVE
  "The review is irrelevant to the work being reviewed"
  IRRELEVANT
  "The review contains content that harasses or bullies others"
  HARASSMENT
  "The review contains hate speech or discriminatory content"
  HATE_SPEECH
  "The review contains spoilers about the work"
  SPOILERS
  "The review is suspected to be fake or written by a bot"
