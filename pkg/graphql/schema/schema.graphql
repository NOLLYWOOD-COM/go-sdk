enum ArticleStatus {
  DRAFT
  PUBLISHED
  UNPUBLISHED
  ARCHIVED
}

enum ArticleTagEntityType {
  WORK
  PERSON
}

type ArticleTag {
  id: ID!
  entityType: ArticleTagEntityType!
  entityId: ID!
  createdAt: String!
  work: Work
  person: Person
}

type Article {
  id: ID!
  userId: ID!
  author: User
  slug: String!
  title: String!
  coverImageId: ID
  coverImage: Media
  summary: String
  seoTitle: String
  seoDescription: String
  seoKeywords: [String!]
  content: String!
  status: ArticleStatus!
  tags: [ArticleTag!]
  createdAt: String!
  updatedAt: String!
  archivedAt: String
  publishedAt: String
}

type ArticlesConnection {
  items: [Article!]!
  pageInfo: PageInfo!
}

input CreateArticleInput {
  title: String!
  slug: String
  coverImageId: ID
  summary: String
  content: String!
  seoTitle: String
