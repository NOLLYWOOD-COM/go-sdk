enum TriviaStatus {
  "Trivia created but not yet submitted for review"
  DRAFT
  "Trivia submitted and pending approval"
  PENDING_REVIEW
  "Trivia declined for not meeting guidelines"
  DECLINED
  "Trivia approved and published"
  PUBLISHED
  "Trivia archived"
