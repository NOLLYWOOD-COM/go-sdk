type ApiKey {
  id: ID!
  name: String!
  description: String
  serviceAccountId: String
  userId: String
  lastUsedAt: String
  value: String
  expiresAt: String
  createdAt: String!
  updatedAt: String!
}

type ApiKeyConnection {
  items: [ApiKey!]!
  pageInfo: PageInfo!
}

input CreateApiKeyInput {
  name: String!
  description: String
  serviceAccountId: String
  userId: String
  ttl: Int
}

input UpdateApiKeyInput {
  name: String
  description: String
  expiresAt: String
}

input ListApiKeysInput {
  pagination: PaginationInput! = {page: 1, pageSize: 20}
  sort: SortInput! = {sortBy: "createdAt", sortOrder: desc}
  expired: Boolean
  serviceAccountId: String
  userId: String
  search: String
}

